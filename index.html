<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>はじめての自己紹介ページ</title>
    <style>
      body {
        max-width: 680px;
        margin: 64px auto;
        padding: 0 24px;
        background: #ecfdf5;
        color: #1f2937;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
        line-height: 1.8;
      }

      main {
        padding: 36px;
        background: #ffffff;
        border: 1px solid #bbf7d0;
        border-radius: 28px;
        box-shadow: 0 12px 30px rgba(22, 101, 52, 0.12);
      }

      h1 {
        color: #15803d;
        border-bottom: 2px solid #22c55e;
        padding-bottom: 12px;
      }

      h2 { color: #166534; }

      .goal {
        margin-top: 28px;
        padding: 18px;
        background: #eff6ff;
        border-left: 5px solid #22c55e;
        border-radius: 14px;
      }

      .goal h2 { margin-top: 0; }

      .goal-settings {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 16px 0;
      }

      .goal-settings label { font-weight: 600; }

      .goal-settings input {
        width: 5rem;
        padding: 8px;
        border: 1px solid #93c5fd;
        border-radius: 8px;
        font: inherit;
      }

      .goal-settings button { background: #2563eb; }

      .goal-settings button:hover { background: #1d4ed8; }

      .goal-status {
        min-height: 1.8em;
        color: #166534;
        font-weight: 600;
      }

      .workout-button {
        background: #2563eb;
      }

      .workout-button:hover { background: #1d4ed8; }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      .achievement {
        min-height: 1.8em;
        color: #166534;
        font-weight: 600;
      }

      .history {
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid #bfdbfe;
      }

      .history ul {
        margin: 8px 0 0;
        padding-left: 1.4rem;
      }

      button {
        padding: 12px 20px;
        border: 0;
        border-radius: 999px;
        background: #16a34a;
        color: #ffffff;
        cursor: pointer;
        font-size: 1rem;
      }

      button:hover { background: #15803d; }

      button:focus-visible {
        outline: 3px solid #f59e0b;
        outline-offset: 3px;
      }

      .reset-button {
        margin-left: 8px;
        background: #6b7280;
      }

      .reset-button:hover { background: #4b5563; }

      #message {
        min-height: 1.8em;
        color: #166534;
        font-weight: 600;
      }

      @media (max-width: 600px) {
        body {
          margin: 24px auto;
          padding: 0 16px;
        }

        main {
          padding: 24px 18px;
        }

        button {
          display: block;
          width: 100%;
          margin-top: 8px;
        }

        .reset-button {
          margin-left: 0;
        }

        .goal-settings {
          display: block;
        }

        .goal-settings input {
          box-sizing: border-box;
          width: 100%;
          margin-top: 4px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>こんにちは！</h1>
      <p>これは Codex で作った、はじめての自己紹介ページです。</p>
      <h2>名前</h2>
      <p>よっちゃん</p>
      <h2>好きなこと</h2>
      <p>筋トレ</p>
      <p>週に3回、体力作りのために続けています。</p>
      <section class="goal">
        <h2>今月の目標</h2>
        <p id="goal-description">筋トレに12回取り組むこと。</p>
        <div class="goal-settings">
          <label for="goal-input">目標回数</label>
          <input id="goal-input" type="number" min="1" step="1" value="12" />
          <button type="button" id="goal-button">目標を変更する</button>
        </div>
        <p id="goal-status" class="goal-status" aria-live="polite"></p>
        <h2>今月の進み具合</h2>
        <p id="workout-count">12回中、現在4回達成</p>
        <button type="button" id="workout-button" class="workout-button">筋トレを1回記録する</button>
        <p id="achievement-message" class="achievement" aria-live="polite"></p>
        <section class="history" aria-labelledby="history-heading">
          <h2 id="history-heading">記録した日</h2>
          <p id="history-empty">まだ日付の記録はありません。</p>
          <ul id="history-list"></ul>
        </section>
      </section>
      <button type="button" id="cheer-button">今日の応援を見る</button>
      <button type="button" id="reset-button" class="reset-button">応援を見た回数を0回に戻す</button>
      <p id="click-count">応援を見た回数：0回</p>
      <p id="message" aria-live="polite"></p>
    </main>
    <script>
      const cheerButton = document.querySelector("#cheer-button");
      const resetButton = document.querySelector("#reset-button");
      const workoutButton = document.querySelector("#workout-button");
      const goalButton = document.querySelector("#goal-button");
      const message = document.querySelector("#message");
      const clickCountDisplay = document.querySelector("#click-count");
      const workoutCountDisplay = document.querySelector("#workout-count");
      const achievementMessage = document.querySelector("#achievement-message");
      const goalDescription = document.querySelector("#goal-description");
      const goalInput = document.querySelector("#goal-input");
      const goalStatus = document.querySelector("#goal-status");
      const historyList = document.querySelector("#history-list");
      const historyEmpty = document.querySelector("#history-empty");
      const cheers = [
        "今日も一歩ずつ。応援しています！",
        "続けることが、いちばんの力です！",
        "無理せず、自分のペースでいきましょう！"
      ];
      let cheerIndex = 0;
      const savedClickCount = Number.parseInt(
        localStorage.getItem("cheerClickCount") ?? "0",
        10
      );
      let clickCount = Number.isNaN(savedClickCount) ? 0 : savedClickCount;
      const savedWorkoutCount = Number.parseInt(
        localStorage.getItem("workoutCount") ?? "4",
        10
      );
      let workoutCount = Number.isNaN(savedWorkoutCount) ? 4 : savedWorkoutCount;
      const savedWorkoutGoal = Number.parseInt(
        localStorage.getItem("workoutGoal") ?? "12",
        10
      );
      let workoutGoal = Number.isNaN(savedWorkoutGoal) || savedWorkoutGoal < 1
        ? 12
        : savedWorkoutGoal;
      let workoutHistory = loadWorkoutHistory();
      clickCountDisplay.textContent = `応援を見た回数：${clickCount}回`;

      function loadWorkoutHistory() {
        try {
          const savedHistory = JSON.parse(localStorage.getItem("workoutHistory") ?? "[]");

          if (!Array.isArray(savedHistory)) return [];

          return savedHistory.filter((entry) => (
            typeof entry.date === "string"
            && Number.isInteger(entry.count)
            && entry.count > 0
          ));
        } catch {
          return [];
        }
      }

      function getTodayKey() {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, "0");
        const day = String(today.getDate()).padStart(2, "0");

        return `${year}-${month}-${day}`;
      }

      function formatHistoryDate(date) {
        const [year, month, day] = date.split("-");
        return `${Number(year)}年${Number(month)}月${Number(day)}日`;
      }

      function renderWorkoutHistory() {
        historyList.replaceChildren();
        const newestFirst = [...workoutHistory].sort((a, b) => b.date.localeCompare(a.date));

        newestFirst.forEach((entry) => {
          const item = document.createElement("li");
          item.textContent = `${formatHistoryDate(entry.date)}：${entry.count}回`;
          historyList.append(item);
        });

        historyEmpty.hidden = workoutHistory.length > 0;
      }

      function recordWorkoutHistory() {
        const today = getTodayKey();
        const todayEntry = workoutHistory.find((entry) => entry.date === today);

        if (todayEntry) {
          todayEntry.count += 1;
        } else {
          workoutHistory.push({ date: today, count: 1 });
        }

        localStorage.setItem("workoutHistory", JSON.stringify(workoutHistory));
        renderWorkoutHistory();
      }

      function updateWorkoutProgress() {
        goalDescription.textContent = `筋トレに${workoutGoal}回取り組むこと。`;
        goalInput.value = String(workoutGoal);
        workoutCountDisplay.textContent = `${workoutGoal}回中、現在${workoutCount}回達成`;
        localStorage.setItem("workoutCount", String(workoutCount));
        localStorage.setItem("workoutGoal", String(workoutGoal));

        if (workoutCount >= workoutGoal) {
          achievementMessage.textContent = "目標達成！おめでとうございます。";
          workoutButton.disabled = true;
        } else {
          achievementMessage.textContent = "";
          workoutButton.disabled = false;
        }
      }

      updateWorkoutProgress();
      renderWorkoutHistory();

      cheerButton.addEventListener("click", () => {
        message.textContent = cheers[cheerIndex];
        cheerIndex = (cheerIndex + 1) % cheers.length;
        clickCount += 1;
        clickCountDisplay.textContent = `応援を見た回数：${clickCount}回`;
        localStorage.setItem("cheerClickCount", String(clickCount));
      });

      workoutButton.addEventListener("click", () => {
        workoutCount += 1;
        recordWorkoutHistory();
        updateWorkoutProgress();
      });

      goalButton.addEventListener("click", () => {
        const nextWorkoutGoal = Number(goalInput.value);

        if (!Number.isInteger(nextWorkoutGoal) || nextWorkoutGoal < 1) {
          goalStatus.textContent = "目標回数は1以上の整数で入力してください。";
          return;
        }

        workoutGoal = nextWorkoutGoal;
        updateWorkoutProgress();
        goalStatus.textContent = `今月の目標を${workoutGoal}回に変更しました。`;
      });

      resetButton.addEventListener("click", () => {
        const shouldReset = window.confirm(
          "本当に応援を見た回数を0回に戻しますか？"
        );

        if (!shouldReset) return;

        clickCount = 0;
        clickCountDisplay.textContent = "応援を見た回数：0回";
        localStorage.setItem("cheerClickCount", "0");
      });
    </script>
  </body>
</html>
