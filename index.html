<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>はじめての自己紹介ページ</title>
    <style>
      body {
        max-width: 680px;
        margin: 64px auto;
        padding: 0 24px;
        background: #ecfdf5;
        color: #1f2937;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
        line-height: 1.8;
      }

      main {
        padding: 36px;
        background: #ffffff;
        border: 1px solid #bbf7d0;
        border-radius: 28px;
        box-shadow: 0 12px 30px rgba(22, 101, 52, 0.12);
      }

      h1 {
        color: #15803d;
        border-bottom: 2px solid #22c55e;
        padding-bottom: 12px;
      }

      h2 { color: #166534; }

      .goal {
        margin-top: 28px;
        padding: 18px;
        background: #f0fdf4;
        border-left: 5px solid #22c55e;
        border-radius: 14px;
      }

      .goal h2 { margin-top: 0; }

      button {
        padding: 12px 20px;
        border: 0;
        border-radius: 999px;
        background: #16a34a;
        color: #ffffff;
        cursor: pointer;
        font-size: 1rem;
      }

      button:hover { background: #15803d; }

      #message {
        min-height: 1.8em;
        color: #166534;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>こんにちは！</h1>
      <p>これは Codex で作った、はじめての自己紹介ページです。</p>
      <h2>名前</h2>
      <p>よっちゃん</p>
      <h2>好きなこと</h2>
      <p>筋トレ</p>
      <p>週に3回、体力作りのために続けています。</p>
      <section class="goal">
        <h2>今月の目標</h2>
        <p>筋トレに12回取り組むこと。</p>
        <h2>今月の進み具合</h2>
        <p>12回中、現在3回達成</p>
      </section>
      <button type="button" id="cheer-button">今日の応援を見る</button>
      <p id="click-count">応援を見た回数：0回</p>
      <p id="message" aria-live="polite"></p>
    </main>
    <script>
      const cheerButton = document.querySelector("#cheer-button");
      const message = document.querySelector("#message");
      const clickCountDisplay = document.querySelector("#click-count");
      const cheers = [
        "今日も一歩ずつ。応援しています！",
        "続けることが、いちばんの力です！",
        "無理せず、自分のペースでいきましょう！"
      ];
      let cheerIndex = 0;
      let clickCount = 0;

      cheerButton.addEventListener("click", () => {
        message.textContent = cheers[cheerIndex];
        cheerIndex = (cheerIndex + 1) % cheers.length;
        clickCount += 1;
        clickCountDisplay.textContent = `応援を見た回数：${clickCount}回`;
      });
    </script>
  </body>
</html>
